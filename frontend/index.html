<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple task management application to organize and track your tasks">
    <title>Task Manager</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="app-container">

        <header class="app-header">
            <h1 class="app-title">Task Manager</h1>
            <p class="app-subtitle">Organize and track your tasks efficiently</p>
            <div class="user-info">
                <span class="user-name" id="user-name"></span>
                <button class="btn btn-logout" id="logout-btn">Logout</button>
            </div>
        </header>

        <main class="main-content">

            <section class="add-task-section">
                <form id="task-form" class="task-form">
                    <div class="form-group">
                        <label for="task-title">Title *</label>
                        <input type="text" id="task-title" name="title" placeholder="Enter task title" required
                            maxlength="100" autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label for="task-description">Description</label>
                        <textarea id="task-description" name="description"
                            placeholder="Enter task description (optional)" rows="3" maxlength="500"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-btn">
                        <span class="btn-text">Add Task</span>
                    </button>
                </form>
            </section>

            <section class="task-list-section">
                <div class="section-header">
                    <h2 class="section-title">Your Tasks</h2>
                    <span class="task-count" id="task-count">0 tasks</span>
                </div>

                <div class="filter-bar">
                    <div class="filter-group">
                        <label for="filter-search" class="filter-label">Search</label>
                        <input type="text" id="filter-search" class="filter-input" placeholder="Search tasks...">
                    </div>
                    <div class="filter-group">
                        <label for="filter-status" class="filter-label">Status</label>
                        <select id="filter-status" class="filter-select">
                            <option value="all">All Status</option>
                            <option value="pending">Pending</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="filter-sort" class="filter-label">Sort By</label>
                        <select id="filter-sort" class="filter-select">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="title_asc">Title A-Z</option>
                            <option value="title_desc">Title Z-A</option>
                        </select>
                    </div>
                    <button type="button" class="btn btn-clear" id="clear-filters">Clear</button>
                </div>

                <div class="loader" id="loader" aria-label="Loading tasks">
                    <div class="loader-spinner"></div>
                    <span>Loading tasks...</span>
                </div>

                <div class="error-message" id="error-message" role="alert" aria-live="polite"></div>

                <div class="success-message" id="success-message" role="status" aria-live="polite"></div>

                <div class="empty-state" id="empty-state">
                    <div class="empty-icon">📋</div>
                    <h3>No tasks yet</h3>
                    <p>Add your first task above to get started!</p>
                </div>

                <div class="task-list" id="task-list" role="list"></div>
            </section>

        </main>

        <footer class="app-footer">
            <p>&copy; 2025 Task Manager</p>
        </footer>

    </div>

    <div class="modal-overlay" id="edit-modal" aria-hidden="true">
        <div class="modal" role="dialog" aria-labelledby="modal-title">
            <div class="modal-header">
                <h2 id="modal-title">Edit Task</h2>
                <button class="modal-close" id="modal-close" aria-label="Close modal">&times;</button>
            </div>
            <form id="edit-form" class="modal-form">
                <input type="hidden" id="edit-task-id">
                <div class="form-group">
                    <label for="edit-title">Title *</label>
                    <input type="text" id="edit-title" name="title" required maxlength="100" autocomplete="off">
                </div>
                <div class="form-group">
                    <label for="edit-description">Description</label>
                    <textarea id="edit-description" name="description" rows="3" maxlength="500"></textarea>
                </div>
                <div class="form-group">
                    <label for="edit-status">Status</label>
                    <select id="edit-status" name="status">
                        <option value="pending">Pending</option>
                        <option value="in-progress">In Progress</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-edit">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal-overlay" id="confirm-modal" aria-hidden="true">
        <div class="modal modal-confirm" role="alertdialog" aria-labelledby="confirm-title">
            <div class="modal-header">
                <div class="modal-title-wrapper">
                    <span class="modal-icon">⚠️</span>
                    <h2 id="confirm-title">Delete Task</h2>
                </div>
            </div>
            <div class="modal-body">
                <p id="confirm-message">Are you sure you want to delete this task? This action cannot be undone.</p>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancel-delete">Cancel</button>
                <button type="button" class="btn btn-danger" id="confirm-delete">Delete</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
